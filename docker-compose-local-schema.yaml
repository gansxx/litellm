services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        target: runtime
    image: litellm-local-schema
    ports:
      - "4000:4000"
    env_file:
      - .env.local
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}
      LITELLM_DATABASE_SCHEMA: litellm
      ENFORCE_PRISMA_MIGRATION_CHECK: "true"
      STORE_MODEL_IN_DB: "True"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
