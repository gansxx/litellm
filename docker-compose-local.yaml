services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.tailscale-local
    ports:
      - "4000:4000"
    env_file:
      - .env.local
    environment:
      STORE_MODEL_IN_DB: "True"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
